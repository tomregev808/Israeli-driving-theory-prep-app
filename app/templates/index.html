{% extends "base.html" %}
{% block title %}רגב תיאוריה — בית{% endblock %}
{% block content %}

<section class="home">
    <h1>רגב תיאוריה</h1>
    <p>אפליקציית תאוריה - מספר 1!</p>

    <div class="actions">
        <a href="{{ url_for('frontend.question') }}" class="btn primary">תרגל שאלות חדשות</a>
        <a href="{{ url_for('frontend.review_failed') }}" class="btn secondary">חזור על שאלות שטעית בהן</a>
        <a href="{{ url_for('frontend.select_type') }}" class="btn">בחר סוג מבחן</a>
    </div>

    <button class="btn export" onclick="exportDeck()">📦 ייצא שאלות ל-Anki</button>
</section>

<script>
async function exportDeck() {
    let failed = JSON.parse(localStorage.getItem("failed_questions")) || [];
    if (failed.length === 0) {
        alert("אין שאלות לייצוא");
        return;
    }
    let response = await fetch("/export_deck", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: failed })
    });
    if (!response.ok) {
        alert("בעיה ביצוא החפיסה");
        return;
    }
    let blob = await response.blob();
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "failed_questions.apkg";
    a.click();
    URL.revokeObjectURL(url);
}
</script>

{% endblock %}
