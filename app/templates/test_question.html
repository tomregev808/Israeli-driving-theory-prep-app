{% extends "base.html" %}
{% block title %}מבחן סימולציה{% endblock %}
{% block content %}

<section class="question-box">
    <h2>שאלה {{ index }} מתוך {{ total }}</h2>
    <div id="questions"></div>
    <h3>{{ question.id }}: {{ question.title }}</h3>

    {% if question.image %}
        <img src="{{ question.image }}" alt="תמונה לשאלה">
    {% endif %}

<form method="POST" action="{{ url_for('frontend.test_answer') }}">
    {% for i in range(4) %}
        <label class="answer">
            <input type="radio" name="answer" value="{{ i }}" required>
            {{ question['answer_' ~ i] }}
        </label>
    {% endfor %}
    <input type="hidden" name="question_id" value="{{ question.id }}">
    <button type="submit">הבא</button>
</form>
</section>
{% endblock %}
