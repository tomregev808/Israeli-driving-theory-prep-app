<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>שאלות חדשות</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>שאלות חדשות</h1>
    <div id="questions"></div>

    <script>
        async function loadFailedQuestions() {


            // Fetch from API
            let response = await fetch("/api/get_type_questions?type=" + "{{ type }}");
            let questions = await response.json();
            questions = [questions[Math.floor(Math.random() * questions.length)]]; 


            let container = document.getElementById("questions");
            container.innerHTML = "";

            questions.forEach(q => {
                let box = document.createElement("div");
                box.className = "question-box";

                box.innerHTML = `
                    <h2>${q.title}</h2>
                    ${q.image ? `<img src="${q.image}" alt="תמונה לשאלה">` : ""}
                    <form method="POST" action="{{ url_for('frontend.check', review=0) }}">
                        ${[0,1,2,3].map(i => `
                            <label>
                                <input type="radio" name="answer" value="${i}" required>
                                ${q["answer_" + i]}
                            </label>
                        `).join("")}
                        <input type="hidden" name="question_id" value="${q.id}">
                        <button type="submit">שלח תשובה</button>
                    </form>
                `;

                container.appendChild(box);
            });
        }

        loadFailedQuestions();
    </script>



</body>
</html>
